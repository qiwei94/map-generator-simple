# Dedicated nginx process for the remote-worker control channel.
#
# This deliberately does not include the distribution nginx.conf: the public
# studio already owns port 80.  The only listener created here is the
# worker-only TLS endpoint defined below.
worker_processes 1;
pid /run/map-worker-tls-nginx.pid;
error_log /var/log/nginx/map-worker-tls-error.log notice;

events {
    worker_connections 256;
}

http {
    access_log /var/log/nginx/map-worker-tls-access.log;

    server {
        listen 443 ssl;
        listen [::]:443 ssl;
        server_name 118.31.184.240;

        ssl_certificate /etc/pki/nginx/map-worker-control.crt;
        ssl_certificate_key /etc/pki/nginx/private/map-worker-control.key;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_session_cache shared:map_worker_tls:2m;
        ssl_session_timeout 10m;

        client_max_body_size 1024m;

        location /api/worker/ {
            proxy_pass http://127.0.0.1:80;
            proxy_http_version 1.1;
            proxy_request_buffering off;
            proxy_buffering off;
            proxy_connect_timeout 10s;
            proxy_read_timeout 7200s;
            proxy_send_timeout 7200s;
        }

        location / {
            return 404;
        }
    }
}
