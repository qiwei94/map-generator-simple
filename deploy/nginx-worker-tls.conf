# Worker-only TLS ingress. The public site remains on its existing listener.
# The private key must be generated and retained only on cloud-api.
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name 118.31.184.240;

    ssl_certificate /etc/pki/nginx/map-worker-control.crt;
    ssl_certificate_key /etc/pki/nginx/private/map-worker-control.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:map_worker_tls:2m;
    ssl_session_timeout 10m;

    client_max_body_size 1024m;

    location /api/worker/ {
        proxy_pass http://127.0.0.1:80;
        proxy_http_version 1.1;
        proxy_request_buffering off;
        proxy_buffering off;
        proxy_connect_timeout 10s;
        proxy_read_timeout 7200s;
        proxy_send_timeout 7200s;
    }

    location / {
        return 404;
    }
}
